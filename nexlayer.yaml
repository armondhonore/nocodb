application:
  name: nocodb
  pods:
    - name: app
      image: "mirror.gcr.io/nocodb/nocodb:latest"
      path: /
      servicePorts:
        - 8080
      vars:
        NC_DB: "sqlite3:/usr/app/data/?database=noco.db"
      volumes:
        - name: data
          mountPath: /usr/app/data
          size: 5Gi